<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💍 العد التنازلي ليوم الفرح 💍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Marck+Script&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <canvas id="particles"></canvas>
  <div class="bokeh" id="bokeh"></div>
  <div class="hearts" id="hearts"></div>
  <div class="lanterns" id="lanterns"></div>
  <canvas id="fireworks"></canvas>
  <canvas id="confetti"></canvas>

  <!-- corner florals -->
  <div class="corner tl"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f5e6a8" />
            <stop offset="1" stop-color="#d4af37" />
          </linearGradient>
        </defs>
        <path d="M5 5 C 60 20, 90 50, 100 100" />
        <path d="M5 5 C 30 60, 60 90, 110 100" />
        <circle cx="40" cy="30" r="6" fill="#f5e6a8" opacity=".6" />
        <circle cx="70" cy="55" r="9" fill="#e8c5c5" opacity=".55" />
        <circle cx="95" cy="85" r="7" fill="#f5e6a8" opacity=".5" />
        <path d="M30 80 q10 -20 25 -10" />
        <path d="M60 110 q10 -15 22 -5" />
        <circle cx="20" cy="60" r="4" fill="#d4af37" opacity=".55" />
        <circle cx="85" cy="20" r="4" fill="#d4af37" opacity=".55" />
      </g>
    </svg></div>
  <div class="corner tr"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="url(#g2)" stroke-width="1.3" stroke-linecap="round">
        <defs>
          <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f5e6a8" />
            <stop offset="1" stop-color="#d4af37" />
          </linearGradient>
        </defs>
        <path d="M5 5 C 60 20, 90 50, 100 100" />
        <path d="M5 5 C 30 60, 60 90, 110 100" />
        <circle cx="40" cy="30" r="6" fill="#f5e6a8" opacity=".6" />
        <circle cx="70" cy="55" r="9" fill="#e8c5c5" opacity=".55" />
        <circle cx="95" cy="85" r="7" fill="#f5e6a8" opacity=".5" />
      </g>
    </svg></div>
  <div class="corner bl"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="url(#g3)" stroke-width="1.3" stroke-linecap="round">
        <defs>
          <linearGradient id="g3" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f5e6a8" />
            <stop offset="1" stop-color="#d4af37" />
          </linearGradient>
        </defs>
        <path d="M5 5 C 60 20, 90 50, 100 100" />
        <path d="M5 5 C 30 60, 60 90, 110 100" />
        <circle cx="40" cy="30" r="6" fill="#f5e6a8" opacity=".6" />
        <circle cx="70" cy="55" r="9" fill="#e8c5c5" opacity=".55" />
      </g>
    </svg></div>
  <div class="corner br"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="url(#g4)" stroke-width="1.3" stroke-linecap="round">
        <defs>
          <linearGradient id="g4" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f5e6a8" />
            <stop offset="1" stop-color="#d4af37" />
          </linearGradient>
        </defs>
        <path d="M5 5 C 60 20, 90 50, 100 100" />
        <path d="M5 5 C 30 60, 60 90, 110 100" />
        <circle cx="40" cy="30" r="6" fill="#f5e6a8" opacity=".6" />
        <circle cx="70" cy="55" r="9" fill="#e8c5c5" opacity=".55" />
      </g>
    </svg></div>

  <button class="music" id="musicBtn" aria-label="تشغيل الموسيقى">🎵</button>

  <main>
    <section class="couple">
      <div class="label">Together Forever</div>
      <h2>العروسان<span class="amp">ياسر &amp; هيام</span></h2>
    </section>

    <h1 class="title">💍 العد التنازلي ليوم الفرح 💍</h1>
    <p class="subtitle">كل يوم يقربنا من أجمل لحظة</p>

    <div class="date-chip" id="dateChip"></div>

    <div class="timer-wrap">
      <div class="rings" aria-hidden="true">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
      </div>
      <div class="countdown" id="countdown">
        <div class="card">
          <div class="num" id="days">000</div>
          <div class="lbl">يوم</div>
        </div>
        <div class="card">
          <div class="num" id="hours">00</div>
          <div class="lbl">ساعة</div>
        </div>
        <div class="card">
          <div class="num" id="minutes">00</div>
          <div class="lbl">دقيقة</div>
        </div>
        <div class="card">
          <div class="num" id="seconds">00</div>
          <div class="lbl">ثانية</div>
        </div>
      </div>
    </div>

    <div class="quote">
      في كل ثانية تمر، يكتب القدر سطراً جديداً من قصة حبٍّ بدأت بنظرة، وتُتوَّج بوعدٍ أبدي تحت سماءٍ من ذهب.
    </div>

    <footer>❤️ نعد الأيام حتى تبدأ أجمل قصة ❤️</footer>
  </main>

  <div class="celebrate" id="celebrate">
    <h2>🎉 مبروك الزواج 🎉</h2>
  </div>

  <!-- music: soft ambient loop -->
  <audio id="audio" loop preload="none">
    <source src="https://njwagbcbljfyqapntvcf.supabase.co/storage/v1/object/public/audio/Anisa%20Rouhi.mp3"
      type="audio/mpeg">
  </audio>

  <script src="./app.js"></script>

</body>

</html>
